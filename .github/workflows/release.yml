name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  NODE_VERSION: '24.x'

jobs:
  release:
    name: Build and create draft release
    runs-on: ubuntu-latest

    steps:
      - name: Install system sound dependencies
        run: sudo apt-get update && sudo apt-get install -y beep alsa-utils pulseaudio-utils

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Ensure tag commit is on main branch
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag commit belongs to main history."
          else
            echo "Tag commit is not on main branch history."
            exit 1
          fi

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from tag
        id: version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" != v* ]]; then
            echo "Release tags must start with a lowercase v (for example, v1.2.3)."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts

          EXPECTED_VERSION="${VERSION}" node <<'NODE'
          const fs = require('node:fs');

          const expected = process.env.EXPECTED_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const lockVersion = lock.version;
          const lockRootVersion = lock.packages?.['']?.version;
          const companionPath = 'local-audio-host/package.json';
          const companion = JSON.parse(fs.readFileSync(companionPath, 'utf8'));
          companion.version = expected;
          fs.writeFileSync(companionPath, `${JSON.stringify(companion, null, 2)}\n`);

          if (packageVersion !== expected || lockVersion !== expected || lockRootVersion !== expected || companion.version !== expected) {
            console.error(`Expected package.json, package-lock.json, and local-audio-host/package.json to match ${expected}; found ${packageVersion}, ${lockVersion} (lock root ${lockRootVersion}), and ${companion.version}.`);
            process.exit(1);
          }
          NODE

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Compile TypeScript
        run: npm run compile

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          DISPLAY: ':99.0'

      - name: Package extension
        run: npm run package

      - name: Verify VSIX version
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          ROOT_VSIX_FILES=( ./*.vsix )
          AUDIO_VSIX_FILES=( local-audio-host/*.vsix )
          if [[ "${#ROOT_VSIX_FILES[@]}" -ne 1 || "${#AUDIO_VSIX_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one VSIX for each extension; found ${#ROOT_VSIX_FILES[@]} root and ${#AUDIO_VSIX_FILES[@]} audio-client packages."
            exit 1
          fi

          verify_vsix() {
            local vsix_path="$1"
            local expected_id="$2"
            unzip -p "${vsix_path}" extension/package.json | EXPECTED_ID="${expected_id}" EXPECTED_VERSION="${EXPECTED_VERSION}" node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                const manifest = JSON.parse(data);
                const id = `${manifest.publisher}.${manifest.name}`.toLowerCase();
                const expectedId = process.env.EXPECTED_ID.toLowerCase();
                if (id !== expectedId || manifest.version !== process.env.EXPECTED_VERSION) {
                  console.error(`${id}@${manifest.version} does not match ${expectedId}@${process.env.EXPECTED_VERSION}.`);
                  process.exit(1);
                }
                console.log(`Verified ${id}@${manifest.version}.`);
              });
            '
          }

          ROOT_VSIX="${ROOT_VSIX_FILES[0]}"
          AUDIO_VSIX="${AUDIO_VSIX_FILES[0]}"
          verify_vsix "${ROOT_VSIX}" "KazushiKamegawa.sound-notifier-for-copilot-agent-task"
          verify_vsix "${AUDIO_VSIX}" "KazushiKamegawa.sound-notifier-audio-client"

          echo "root_vsix_path=${ROOT_VSIX}" >> "${GITHUB_OUTPUT}"
          echo "audio_vsix_path=${AUDIO_VSIX}" >> "${GITHUB_OUTPUT}"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.root_vsix_path }}
            ${{ steps.package.outputs.audio_vsix_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
