name: VS Code Extension CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'local-audio-host/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscodeignore'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'local-audio-host/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscodeignore'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
env:
  NODE_VERSION: '24.x'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Install system sound dependencies
      run: sudo apt-get update && sudo apt-get install -y beep alsa-utils pulseaudio-utils

    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Start Xvfb
      run: |
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        export DISPLAY=:99.0
    - name: Install dependencies
      run: npm ci
      
    - name: Compile TypeScript
      run: npm run compile
      
    - name: Run linter
      run: npm run lint
      
    - name: Run tests
      run: npm test
      env:
        DISPLAY: ':99.0'
      
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          test-results.xml
          coverage/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level high
      
    - name: Check for vulnerabilities
      run: npm audit --audit-level moderate
      
    - name: Run npm audit fix
      run: npm audit fix --dry-run

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Compile
      run: npm run compile
      
    - name: Package extension
      run: npm run package
      
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix-package
        path: |
          *.vsix
          local-audio-host/*.vsix
        retention-days: 30


