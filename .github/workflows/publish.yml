name: Publish to VS Code Marketplace

on:
  release:
    types: [published]

env:
  NODE_VERSION: '24.x'

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Sync version from release tag
      shell: bash
      run: |
        case "$GITHUB_REF_NAME" in
          v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          *) echo "Release tag must start with lowercase v."; exit 1 ;;
        esac
        npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
        EXPECTED_VERSION="$VERSION" node <<'NODE'
        const fs = require('node:fs');

        const expected = process.env.EXPECTED_VERSION;
        const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
        const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
        const lockVersion = lock.version;
        const lockRootVersion = lock.packages?.['']?.version;
        const companionPath = 'local-audio-host/package.json';
        const companion = JSON.parse(fs.readFileSync(companionPath, 'utf8'));
        companion.version = expected;
        fs.writeFileSync(companionPath, `${JSON.stringify(companion, null, 2)}\n`);

        if (packageVersion !== expected || lockVersion !== expected || lockRootVersion !== expected || companion.version !== expected) {
          console.error(`Release tag version does not match package.json, package-lock.json, and local-audio-host/package.json: expected ${expected}, found ${packageVersion}, ${lockVersion} (lock root ${lockRootVersion}), and ${companion.version}.`);
          process.exit(1);
        }
        NODE
    - name: Compile TypeScript
      run: npm run compile
      
    - name: Run linter
      run: npm run lint
      
    - name: Package extension
      run: npm run package
      
    - name: Get VSIX filename
      run: |
        ROOT_VSIX=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
        AUDIO_VSIX=$(find local-audio-host -maxdepth 1 -type f -name '*.vsix' -print -quit)
        if [ -z "$ROOT_VSIX" ] || [ -z "$AUDIO_VSIX" ]; then
          echo "Both root and local audio VSIX packages must be present."
          exit 1
        fi
        echo "ROOT_VSIX=$ROOT_VSIX" >> "$GITHUB_ENV"
        echo "AUDIO_VSIX=$AUDIO_VSIX" >> "$GITHUB_ENV"
        echo "Publishing $AUDIO_VSIX before $ROOT_VSIX"
      
    - name: Publish local audio host to VS Code Marketplace
      run: npx vsce publish --no-yarn --packagePath "$AUDIO_VSIX"
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Publish main extension to VS Code Marketplace
      run: npx vsce publish --no-yarn --packagePath "$ROOT_VSIX"
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
        
    - name: Publish local audio host to Open VSX Registry
      run: npx ovsx publish "$AUDIO_VSIX"
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      continue-on-error: true

    - name: Publish main extension to Open VSX Registry
      run: npx ovsx publish "$ROOT_VSIX"
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      continue-on-error: true
