name: Publish to VS Code Marketplace

on:
  release:
    types: [published]

env:
  NODE_VERSION: '24.x'

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Sync version from release tag
      shell: bash
      run: |
        case "$GITHUB_REF_NAME" in
          v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          *) echo "Release tag must start with lowercase v."; exit 1 ;;
        esac
        npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
        if [ "$PACKAGE_VERSION" != "$VERSION" ] || [ "$LOCK_VERSION" != "$VERSION" ]; then
          echo "Release tag version does not match package.json and package-lock.json."
          exit 1
        fi
    - name: Compile TypeScript
      run: npm run compile
      
    - name: Run linter
      run: npm run lint
      
    - name: Package extension
      run: npm run package
      
    - name: Get VSIX filename
      run: |
        VSIX_FILE=$(ls *.vsix | head -1)
        echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV
        echo "Publishing $VSIX_FILE"
      
    - name: Publish to VS Code Marketplace
      run: npx vsce publish --no-yarn
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
        
    - name: Publish to Open VSX Registry
      run: npx ovsx publish "$VSIX_FILE"
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      continue-on-error: true
